[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chakravyuh"
version = "0.1.0"
description = "Synthetic AI-agent security checkpoint for the GOAT Coders hackathon"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
